# Les LLM sont servis par le projet `llm-service` (conteneur `ollama-central`,
# réseau `llm-net`), jamais par une instance embarquée ici. Un Ollama local
# vivait dans ce fichier : `docker compose up -d` le recréait et retéléchargeait
# plusieurs Go de modèle en doublon de celui que le service central sert déjà.
#
# Prérequis : `make up` dans llm-service, et la stack rag-ingestion-pipeline
# démarrée (elle crée le réseau `rag_network` et héberge les stores).

services:

  # ──────────────────────────────────────────────────────────────────
  # Backend FastAPI
  # ──────────────────────────────────────────────────────────────────
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent
      # L'IDENTITÉ DU CODE ENTRE DANS L'IMAGE ICI, ET NULLE PART AILLEURS.
      #
      # `${VAR:-}` — ET ICI LES DEUX-POINTS NE CHANGENT RIEN. CETTE PHRASE
      # REMPLACE UNE AFFIRMATION QUI NE ROUGISSAIT PAS. La rédaction du lot 22
      # ouvrait par « le détail n'est pas cosmétique » ; il l'est, sur ce
      # fichier-ci, et la mutation `${VAR:-}` → `${VAR-}` est donc ÉQUIVALENTE.
      # Elle est avouée comme telle plutôt que présentée comme une trouvaille.
      #
      # LA RAISON EST EXACTE, ET LE DOMAINE EST EXHAUSTIF — PAS ÉCHANTILLONNÉ.
      # Les deux formes ne peuvent différer que sur UN état de la variable, celui
      # où elle est PRÉSENTE ET VIDE : `${VAR:-X}` y replie sur `X`, `${VAR-X}`
      # y rend la chaîne vide. Ici `X` EST la chaîne vide, donc les deux rendent
      # la même chose. Une variable n'a que trois états — absente, présente et
      # vide, présente et non vide — et les trois sont couverts : il n'y a aucun
      # cas restant où les deux formes pourraient se séparer.
      #
      # `mesuré` le 16 septembre 2026 à 12:44 UTC par REPAR-23, sur une COPIE de
      # ce fichier en projet isolé (`-p repar23probe`, `.env` vide — sans quoi la
      # commande échoue et rend une sortie vide qu'on lirait comme un résultat),
      # par `docker compose config --format json`. Les deux formes coïncident sur
      # les SEPT valeurs balayées : absente, vide, un espace, deux espaces,
      # `abc`, `0`, un saut de ligne. Que les deux compose soient bien distincts
      # est doublé du SHA-256 du fichier, sans quoi la mesure aurait comparé deux
      # fois la même chose. *(L'audit du lot 22 avait établi le même résultat sur
      # trois valeurs ; ce relevé étend le domaine, notamment à l'ESPACE — le cas
      # que la rédaction précédente invoquait, et qui ne sépare pas davantage.)*
      #
      # CE QUI RESTE VRAI ET IMPORTE ICI : quel que soit le chemin, une variable
      # non renseignée fait entrer une chaîne VIDE dans le build, donc une image
      # qui se déclare ANONYME. C'est la position à tenir — une image non
      # instrumentée ne doit jamais passer pour identifiée —, et elle ne dépend
      # d'aucune subtilité d'interpolation. `_lire` du module d'identité dépouille
      # de toute façon les blancs et ramène la chaîne vide à `None`.
      #
      # POURQUOI UN REPLI PLUTÔT QU'UNE ERREUR. Sans repli, `docker compose
      # build` échouerait dans un shell où ces variables ne sont pas exportées —
      # y compris pour un `docker compose up -d` qui reconstruit. Faire échouer
      # le build n'aurait pas rendu l'identité plus sûre : elle aurait poussé à
      # exporter n'importe quoi pour débloquer. L'anonymat déclaré est plus
      # honnête qu'un build qu'on contourne.
      #
      # LE GESTE QUI LES REMPLIT EST `make image`. Il relève le sha ET la
      # propreté de l'arbre, puis appelle ce build. Un `docker compose build` nu
      # reste licite et produit une image anonyme, qui le dit dans `/health`.
      # Garde : `tests/unit/test_identite_du_code.py`.
      args:
        CODE_SHA: ${RAG_AGENT_CODE_SHA:-}
        CODE_ARBRE: ${RAG_AGENT_CODE_ARBRE:-}
        CODE_CONSTRUITE_LE: ${RAG_AGENT_CODE_CONSTRUITE_LE:-}
    container_name: rag-agent-api
    ports:
      - "8011:8000"
    volumes:
      - ./prompts:/app/prompts:ro
      # Modèles HF (embedding + cross-encoder) téléchargés au premier démarrage,
      # persistés pour survivre aux recreate du conteneur.
      - hf_cache:/root/.cache/huggingface
      # Sessions LangGraph : une session en attente de sélection doit survivre
      # à un redémarrage de l'API.
      - agent_state:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # LA RÉSERVATION DU GPU, ET ELLE NE VAUT QUE POUR CE SERVICE.
    #
    # C'est la deuxieme des trois conditions qui font qu'un calcul part sur la
    # carte : sans elle, aucun `/dev/nvidia*` n'entre dans le conteneur et
    # `torch.cuda.is_available()` rend faux, build CUDA ou non. Les deux autres
    # sont le build de torch (`Dockerfile.agent`) et le réglage `TORCH_DEVICE`
    # (`src/agent/settings.py`, défaut `cpu`). Chacune suffit à désactiver le
    # GPU, et aucune ne le signale : `documentation/gpu_cuda.md` dit comment
    # vérifier les trois, une par une.
    #
    # PAS SUR `frontend`, et ce n'est pas un oubli : il ne charge aucun modèle.
    # Une réservation y prendrait un périphérique sur une carte que se PARTAGENT
    # déjà Ollama — 4 904 Mio, et 84 % du temps d'une réponse — et ce service.
    #
    # `count: 1` plutôt que `all` : ce poste n'a qu'une carte (`nvidia-smi`,
    # `mesuré` le 11 septembre 2026), et `all` sur un poste qui en aurait
    # plusieurs donnerait au lecteur des cartes que personne ne lui a décidées.
    #
    # ⚠ CE QU'ELLE COÛTE, ET C'EST MESURÉ : elle rend le DÉMARRAGE de ce service
    # dépendant d'un GPU, alors que son CALCUL ne l'est pas. Sur une machine sans
    # carte, sans pilote ou sans NVIDIA Container Toolkit, le conteneur ne démarre
    # pas du tout — `mesuré` le 11 septembre 2026 en demandant deux cartes à un
    # poste qui n'en a qu'une : `docker run` rend **rc=125** et
    # `nvidia-container-cli: device error: 1: unknown device`, sans qu'aucun
    # processus ait démarré. Ce n'est pas une dégradation, c'est une panne
    # sèche, et c'est ce qui a été RENDU au pipeline d'ingestion
    # (`documentation/pour_le_pipeline_ingestion.md`), dont le document
    # déclarait « aucun GPU n'est requis ».
    #
    # POUR DÉMARRER SANS CARTE : commenter ce bloc `deploy:`, puis
    # `docker compose up -d agent-api`. Le service fonctionne à l'identique —
    # `TORCH_DEVICE` vaut `cpu`. Le geste est au §8 de `documentation/gpu_cuda.md`.
    #
    # CE QU'ELLE NE FAIT PAS : mettre le service sur le GPU. Elle le rend
    # ATTEIGNABLE. `/health` publie `torch_device.cuda_available` pour cette
    # condition-ci, et `torch_device.embedding` / `.rerank` pour dire s'il est
    # réellement atteint — un `cuda_available: true` avec `embedding: "cpu"` est
    # l'état normal de ce service, pas une panne.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - rag_network
      - internal
      - llm-net

  # ──────────────────────────────────────────────────────────────────
  # Frontend Streamlit
  # ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: rag-frontend
    ports:
      - "8506:8501"
    environment:
      API_URL: http://agent-api:8000
    depends_on:
      agent-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

# ──────────────────────────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────────────────────────
volumes:
  agent_state:
    name: rag_agent_state
  hf_cache:
    name: rag_hf_cache

# ──────────────────────────────────────────────────────────────────
# Réseaux
# ──────────────────────────────────────────────────────────────────
networks:
  rag_network:
    external: true   # Réseau créé par rag-ingestion-pipeline
  llm-net:
    external: true   # Réseau créé par llm-service (Ollama central)
  internal:
    driver: bridge
