[project]
name = "rag-agent-chat"
version = "0.1.0"
description = "Agent RAG conversationnel : retrieval, graph context, génération LLM locale"
requires-python = ">=3.12"
# Dépendances runtime — source de vérité pour uv (`uv sync`). requirements.txt
# est conservé pour le build des images Docker (Dockerfile.agent / .frontend).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "python-multipart==0.0.32",
    "sse-starlette==3.4.6",
    "streamlit==1.60.0",
    "langgraph==1.2.10",
    "langchain-core==1.5.3",
    "chromadb==1.5.9",
    "sentence-transformers==5.6.1",
    "nebula3-python==3.8.3",
    "minio==7.2.20",
    "jinja2==3.1.6",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    "langgraph-checkpoint-sqlite==3.1.1",
    "rank-bm25>=0.2.2",
    "aiosqlite==0.22.1",
]

# Le framework `pre-commit` vit dans SON groupe, et pas avec les outils de la
# porte qualite. Trois raisons, toutes mesurees le 3 septembre 2026 :
#
#   1. `uv sync` sans borne installerait les dependances de PRODUCTION, dont
#      `sentence-transformers`, donc `torch` — que `uv.lock` epingle en 2.13.0
#      depuis PyPI, avec 43 paquets `nvidia-*` (`mesure` :
#      `grep -c 'name = "nvidia' uv.lock`). La CI et le protocole d'installation
#      local prennent tous deux la roue CPU depuis un index dedie
#      (`.github/workflows/ci.yml`, `documentation/pilotage_du_chantier.md` §2.2) :
#      armer un hook git ne doit pas telecharger la pile CUDA. D'ou
#      `--only-group hooks` dans la cible `install` du Makefile ;
#   2. les versions de `ruff`, `mypy` et `pytest` ont deja UN site,
#      `requirements-dev.txt`, et c'est lui que la CI installe. Les recopier ici
#      en ferait deux, qui divergeraient sans que rien ne rougisse ;
#   3. `pre-commit`, lui, n'a aucun site : il n'est ni dans `requirements.txt`
#      ni dans `requirements-dev.txt`, et la CI n'en a pas besoin — elle appelle
#      `make lint` et `make test` directement, jamais les hooks git.
#
# Version alignee sur celle du depot jumeau `rag-ingestion-pipeline`, dont le
# montage de garde-fous est porte ici : deux frameworks de versions differentes
# sur le meme poste rendraient deux verdicts.
[dependency-groups]
hooks = ["pre-commit==4.6.2"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401",  # dynamically typed expressions (typing.Any)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
# Sans ce drapeau, mypy voit chaque module deux fois — « agent.graph_context »
# et « src.agent.graph_context » — et refuse d'aller plus loin. Le paquet est
# importé sous `src.` partout ailleurs.
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "chromadb.*",
    "rank_bm25.*",
    "nebula3.*",
    "minio.*",
    "sentence_transformers.*",
    "fastapi.*",
    "uvicorn",
    "streamlit.*",
    "langgraph.*",
    "langchain_core.*",
    "openai.*",
    "jinja2.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests requiring heavy infrastructure (NebulaGraph, Ollama)",
    "integration: tests requiring Docker services",
]
# strict-markers : un marqueur inconnu casse la suite au lieu de la laisser
# passer en silence — c'est ainsi qu'un test async peut ne rien executer.
addopts = "-q --tb=short --strict-markers"
asyncio_mode = "strict"
# Fixé explicitement : la valeur par défaut change dans les versions à venir
# de pytest-asyncio, et l'avertissement de dépréciation pollue chaque run.
asyncio_default_fixture_loop_scope = "function"
