- id: q29
  question: How do I stop the assistant from wandering off when someone asks it something nobody planned
    for?
  language: en
  doc_language: en
  type: reformulee
  gold_element_ids:
  - be9026f5ba
  gold_documents:
  - htms/Practical MLflow for Generative AI on Databricks
  unanswerable: false
  reviewed: true
  _origine:
    strate: reformulee
    reponse_attendue: 'By adding guardrails: rules around the LLM, implemented as tools or agents, that
      restrict accepted inputs and outputs so the application stays within expectations even on unexpected
      questions, messy inputs, or deliberate pushes into unsafe territory.'
    motif_de_la_reformulation: 'La question n''emploie ni `guardrail`, ni `restrict`, ni `unsafe` : elle
      decrit le symptome en langue courante. Le recouvrement lexical avec le passage est reduit a `assistant`
      et `ask`.'
- id: q30
  question: Pourquoi une recette de cuisine sert-elle a expliquer qu'un agent devrait pouvoir changer
    d'infrastructure sans etre reecrit ?
  language: fr
  doc_language: en
  type: reformulee
  gold_element_ids:
  - 3b6fb4e59a
  - fbf9cbd029
  gold_documents:
  - htms/Practical MLflow for Generative AI on Databricks
  unanswerable: false
  reviewed: true
  _origine:
    strate: reformulee
    reponse_attendue: 'Une recette est portable : on peut la cuisiner dans n''importe quel four, dans
      n''importe quelle cuisine, parce que ce qu''il faut faire est separe de l''endroit ou on le fait.
      Les cadres d''agents actuels ne separent pas les deux : definir un agent y revient a choisir aussi
      le four et le garde-manger, ce qui produit un enfermement chez un fournisseur et impose de tout
      reconstruire pour changer de cadre.'
    motif_de_la_reformulation: 'Question FRANCAISE sur un document ANGLAIS : c''est la moitie survivante
      de la mesure translinguistique, le corpus etant entierement anglais. Aucun mot de la question n''apparait
      dans le passage.'
